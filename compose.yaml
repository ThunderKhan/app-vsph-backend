services:
  api:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
  postgres:
    image: postgres:17-alpine
    profiles: ["isolated-db"]
    environment:
      POSTGRES_DB: vsph_isolated
      POSTGRES_USER: vsph_test
      POSTGRES_PASSWORD: isolated_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsph_test -d vsph_isolated"]
      interval: 5s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
